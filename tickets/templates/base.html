<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}IT Service Tracker{% endblock %}</title>
<style>
 :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--muted:#667085;--line:#e4e7ec;--brand:#2f5bea}
 *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
 nav{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:16px;align-items:center}
 nav a{color:var(--ink);text-decoration:none} nav .brand{font-weight:700;color:var(--brand)} nav .sp{flex:1}
 main{max-width:960px;margin:24px auto;padding:0 16px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
 table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
 th{color:var(--muted);font-weight:600;font-size:13px}
 input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
 .btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none}
 .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.danger{background:#c0392b}
 .badge{padding:2px 8px;border-radius:999px;font-size:12px;background:#eef2ff;color:var(--brand)}
 .badge.closed{background:#eee;color:#555} .badge.high{background:#fde8e8;color:#b42318}
 .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
 .msg{padding:10px 14px;border-radius:6px;background:#ecfdf3;margin-bottom:12px}
 .err{color:#b42318;font-size:13px} .muted{color:var(--muted);font-size:13px}
 label{font-weight:600;font-size:13px;display:block;margin:10px 0 4px}
</style>
</head>
<body>
<nav>
 <a class="brand" href="{% url 'ticket_list' %}">IT Service Tracker</a>
 {% if user.is_authenticated %}
  <a href="{% url 'ticket_list' %}">Tickets</a>
  <a href="{% url 'ticket_create' %}">New ticket</a>
  <span class="sp"></span>
  <span class="muted">{{ user.username }} · {{ user.profile.get_role_display }}</span>
  <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="btn sec">Log out</button></form>
 {% else %}
  <span class="sp"></span><a href="{% url 'login' %}">Log in</a><a href="{% url 'register' %}">Register</a>
 {% endif %}
</nav>
<main>
 {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
 {% block content %}{% endblock %}
</main>
</body>
</html>
